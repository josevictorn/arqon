# Dependency update policy — ADR-0022.
#
# - Only patch/minor updates become PRs. Majors are ignored: ADR-0003 requires
#   a new ADR for any major upgrade, done in a dedicated task.
# - NestJS + Fastify move together in their own group (they pin each other).
# - MongoDB stays on the 8.0 line (patch only).
# - Commit prefixes follow commitlint.config.ts (scope `deps`).
# - `cooldown` waits a few days after a release before proposing it, reducing
#   exposure to compromised or quickly-yanked versions.
# - Dependabot never merges: every PR goes through CI and human review.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps)
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      nestjs:
        patterns: [ "@nestjs/*", "fastify", "@fastify/*" ]
      npm:
        patterns: [ "*" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: [ "*" ]

  # Images pinned in docker-compose.yml (ADR-0021).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: mongo
        update-types: [ "version-update:semver-minor" ]
    groups:
      docker-compose:
        patterns: [ "*" ]
